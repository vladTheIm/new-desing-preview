<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SchoolPro — Admin Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f1;--sf:#fff;--ink:#1a1a1a;--mu:#6b6b66;--ln:#e7e7e2;--y:#ffcc00;--yd:#d9a800;--soft:#fff6cc;--ok:#1a9b4b;--bad:#c62828;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--sf:#1e1e1c;--ink:#f3f3ef;--mu:#a3a39c;--ln:#2e2e2b;--soft:#3a3300;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121211;--sf:#1e1e1c;--ink:#f3f3ef;--mu:#a3a39c;--ln:#2e2e2b;--soft:#3a3300;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hide{display:none!important}
/* login */
#login{min-height:100vh;padding:28px;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 40%, rgba(26,42,108,.27) 0%, transparent 60%),radial-gradient(ellipse at 80% 80%, rgba(35,65,68,.13) 0%, transparent 60%),var(--bg)}
#login .school-login-page{position:relative;width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(180deg,rgba(24,55,96,.85),rgba(51,112,129,.7) 46%,rgba(93,73,125,.74) 72%,rgba(13,8,58,.96)),linear-gradient(135deg,#2d5d94,#6fb6b0 42%,#d28092 68%,#10064a)}
#login .school-login-page::before{content:'';position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(145deg,transparent 0 7%,rgba(31,22,77,.96) 7% 18%,transparent 18% 28%,rgba(19,14,63,.98) 28% 45%,transparent 45% 56%,rgba(30,20,79,.94) 56% 70%,transparent 70%),linear-gradient(180deg,transparent,rgba(9,5,45,.95));opacity:.95}
#login .school-login-page::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.05),transparent 30%,rgba(0,0,0,.2));pointer-events:none}
.school-login-shell{position:relative;z-index:1;width:min(1200px,94vw);min-height:200px;display:grid;grid-template-columns:1fr;align-items:stretch;filter:drop-shadow(0 24px 48px rgba(0,0,0,.34))}
.school-login-welcome{position:relative;border-radius:18px 18px 0 0;overflow:hidden;background:linear-gradient(135deg,rgba(82,104,210,.82),rgba(179,68,144,.76) 48%,rgba(238,37,47,.86)),linear-gradient(18deg,rgba(255,255,255,.08) 0 19%,transparent 19% 100%),linear-gradient(142deg,transparent 0 22%,rgba(255,255,255,.12) 22% 29%,transparent 29% 100%),linear-gradient(180deg,#4869b8,#d94a60);clip-path:polygon(0 0,100% 0,100% 36%,84% 50%,100% 64%,100% 100%,0 100%)}
.school-login-welcome::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 2px,transparent 2px 8px),linear-gradient(120deg,transparent 0 14%,rgba(10,24,90,.24) 14% 22%,transparent 22% 55%,rgba(255,255,255,.08) 55% 61%,transparent 61%),linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.26))}
.school-login-welcome::after{content:'';position:absolute;left:-8%;right:-8%;bottom:-1px;height:31%;background:linear-gradient(138deg,transparent 0 11%,rgba(36,25,93,.5) 11% 21%,transparent 21% 100%),linear-gradient(36deg,rgba(23,19,74,.42) 0 24%,transparent 24% 100%),linear-gradient(180deg,rgba(255,255,255,.08),rgba(50,30,95,.38))}
.school-login-welcome-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:24px 32px 56px 24px}
.school-login-welcome h1{font-size:2.2rem;text-transform:uppercase;line-height:1;font-weight:900;margin:0}
.school-login-welcome p{color:rgba(255,255,255,.85);font-weight:700;margin-top:10px;font-size:.95rem}
.school-login-rule{width:128px;height:3px;background:#fff;margin:10px 0 20px}
.school-login-side-icon{width:140px;height:140px;margin-bottom:20px;display:block;border-radius:20px}
.school-login-panel{border-radius:0 0 16px 16px;background:#202020;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 6%}
.school-login-main-icon{width:110px;height:110px;max-width:100%;margin-bottom:16px;display:block;border-radius:20px}
.school-login-panel p{margin:0 0 8px;color:#777;font-weight:700}
.school-login-form{width:min(620px,100%);display:grid;gap:14px}
.school-login-form .field-label{display:block;font-size:.78rem;font-weight:800;letter-spacing:.02em;color:#8a8a8a;margin-bottom:6px}
.school-login-field{height:60px;border:1px solid #464646;border-radius:999px;display:flex;align-items:center;gap:16px;padding:0 24px;background:#202020;color:#686868;transition:border-color .2s,box-shadow .2s}
.school-login-field:focus-within{border-color:#777;box-shadow:0 0 0 4px rgba(255,255,255,.04)}
.school-login-field svg{width:22px;height:22px;flex-shrink:0}
.school-login-field input{width:100%;border:0;outline:0;background:transparent;color:#fff;font:inherit;font-weight:800;font-size:.96rem}
.school-login-field input::placeholder{color:#858585;font-weight:700}
.school-login-options{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:2px 16px 10px}
.school-login-remember{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;cursor:pointer}
.school-login-remember input{appearance:none;width:22px;height:22px;border:1px solid #4c4c4c;background:#202020;accent-color:#863bff}
.school-login-remember input:checked{background:#863bff;border-color:#777}
.school-login-options button{border:0;background:transparent;color:#686868;font:inherit;font-weight:800;cursor:pointer}
.school-login-options button:hover,.school-login-register:hover{color:#fff}
.school-login-alert{color:#ffb4b4;font-weight:700;font-size:.85rem;min-height:20px;text-align:center;width:min(620px,100%);margin-bottom:16px}
.school-login-submit{height:64px;border:1px solid #464646;border-radius:999px;background:#202020;color:#fff;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-size:1rem;font-weight:900;cursor:pointer;box-shadow:0 12px 24px rgba(0,0,0,.22);transition:transform .2s,border-color .2s,background .2s}
.school-login-submit:hover{transform:translateY(-1px);border-color:#777;background:#252525}
.school-login-submit svg{width:20px;height:20px}
.school-login-register{margin-top:24px;color:#777;text-decoration:none;font-weight:800}
.school-login-panel small{margin-top:30px;color:#565656;font-size:.94rem;font-weight:800}
.school-login-side-icon svg,.school-login-main-icon svg{width:100%;height:100%;display:block}
@media(min-width:900px){
 #login{padding:20px}
 .school-login-shell{grid-template-columns:minmax(280px,.42fr) minmax(380px,1fr)}
 .school-login-welcome{border-radius:18px 0 0 18px}
 .school-login-panel{border-radius:0 16px 16px 0}
}
.brand .logo.sp-emblem{background:transparent!important;color:inherit;border-radius:12px;overflow:hidden}
.brand .logo.sp-emblem img{width:100%;height:100%;object-fit:contain;display:block}
.school-login-side-icon,.school-login-main-icon{object-fit:contain}
.lg-art{display:none;background:#1a1a1a;color:#fff;padding:48px;flex-direction:column;justify-content:flex-end}
.lg-art h2{font-size:44px;line-height:1.05;font-weight:800;max-width:11em}.lg-art h2 span{color:var(--y)}
.lg-art p{color:#c9c9c2;margin-top:14px;max-width:28em}
.lg-box{padding:40px 24px;display:flex;flex-direction:column;justify-content:center;max-width:440px;width:100%;margin:0 auto}
.logo{width:52px;height:52px;border-radius:50%;background:#1a1a1a;color:var(--y);display:grid;place-items:center;font-weight:800;font-size:17px;margin-bottom:22px}
.lg-box h1{font-size:30px;font-weight:800;margin-bottom:6px}.lg-box p{opacity:.75;margin-bottom:22px}
label{display:block;font-weight:600;font-size:13px;margin:0 0 6px}
input,select{width:100%;padding:14px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:500 16px 'Outfit',sans-serif;margin-bottom:14px}
#login .school-login-field input{border:0;background:transparent;color:#fff}
.err{color:var(--bad);font-weight:600;font-size:13px;min-height:18px;margin:-6px 0 10px}
#login .err{color:#7a0000}
@media(min-width:900px){#login{grid-template-columns:1.2fr 1fr}.lg-art{display:flex}}
/* app shell */
#app{height:100%;display:flex}
.side{width:248px;flex-shrink:0;background:var(--sf);border-right:1px solid var(--ln);padding:22px 14px;display:none;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;padding:0 8px 18px}
.brand .logo{width:38px;height:38px;font-size:13px;margin:0}
.side button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:12px;border-radius:12px;font:600 15px 'Outfit',sans-serif;cursor:pointer;text-align:left;color:var(--mu)}
.side button.on{background:var(--y);color:#1a1a1a}
.side button:hover:not(.on){background:var(--bg)}
.side .grow{flex:1}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--y);color:#1a1a1a;padding:16px 20px 26px;display:flex;justify-content:space-between;align-items:center}
.top .hi{font-size:13px;opacity:.75}.top .nm{font-size:20px;font-weight:700}
.top .r{display:flex;gap:10px;align-items:center}
.ib{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.1);border:0;font-size:17px;cursor:pointer}
.scroll{flex:1;overflow-y:auto;padding:0 16px 24px}
.wrap{max-width:1040px;margin:0 auto}
.nav{display:flex;background:var(--sf);border-top:1px solid var(--ln);padding:6px 4px 8px}
.nav button{flex:1;border:0;background:none;color:var(--mu);font:600 11px 'Outfit',sans-serif;cursor:pointer;padding:4px 0}
.nav button i{display:block;font-style:normal;font-size:20px;margin:0 auto 2px;width:46px;border-radius:12px;padding:2px 0}
.nav button.on{color:var(--ink)}.nav button.on i{background:var(--y)}
@media(min-width:900px){.side{display:flex}.nav{display:none}.top{background:var(--bg);padding:26px 32px 6px}.top .hi{color:var(--mu);opacity:1}.top .ib{background:var(--sf);border:1px solid var(--ln)}.scroll{padding:0 32px 40px}}
/* ui */
.hero{background:#1a1a1a;color:#fff;border-radius:22px;padding:20px;margin-top:-16px;display:grid;gap:14px}
.hero small{color:#c9c9c2;font-size:12px}
.big{font-size:38px;font-weight:800;letter-spacing:-.5px}.big span{color:var(--y)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:#2a2a27;border-radius:14px;padding:10px 12px}.mini b{display:block;font-size:17px;margin-top:2px}
@media(min-width:900px){.hero{margin-top:14px;grid-template-columns:1.1fr 1fr;align-items:center;padding:26px}.big{font-size:48px}}
.sec{font-size:16px;font-weight:700;margin:22px 2px 10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;align-items:start}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.q{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px 4px;text-align:center;font:600 13px 'Outfit',sans-serif;cursor:pointer}
.q i{display:block;font-style:normal;font-size:24px;margin-bottom:4px}
.q:hover{border-color:var(--y)}.q:active,.btn:active{transform:scale(.97)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px}
.bar{height:10px;border-radius:6px;background:var(--ln);overflow:hidden;margin:10px 0 8px}.bar div{height:100%;background:var(--y);border-radius:6px;transition:width .5s}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mu{color:var(--mu);font-size:13px}
.promo{background:var(--soft);border:1px solid var(--yd);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center}
.promo b{display:block;font-size:15px}.promo .em{font-size:28px}
.btn{background:var(--y);color:#1a1a1a;border:0;border-radius:12px;padding:10px 16px;font:700 13px 'Outfit',sans-serif;cursor:pointer;white-space:nowrap}
.btn.dk{background:#1a1a1a;color:#fff}.btn.ln{background:none;border:1px solid var(--ln);color:var(--ink)}
.btn.full{width:100%;padding:15px;font-size:15px;border-radius:14px}
.bd{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;border:2px solid var(--ln);background:var(--sf);border-radius:16px;padding:14px;width:100%;text-align:left}
.bd:hover{border-color:var(--yd)}.bd b{font-size:17px}.price{font-weight:800;font-size:16px}
.tag{display:inline-block;background:var(--y);color:#1a1a1a;font-size:11px;font-weight:700;border-radius:8px;padding:2px 7px;margin-left:6px}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.chip{border:1px solid var(--ln);background:var(--sf);border-radius:20px;padding:8px 16px;font:600 13px 'Outfit',sans-serif;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--y);border-color:var(--y);color:#1a1a1a}
.tx{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln);font-size:14px}
.tx:last-child{border:0}.pos{color:var(--ok);font-weight:600}
.av{width:60px;height:60px;border-radius:50%;background:var(--y);color:#1a1a1a;display:grid;place-items:center;font-weight:800;font-size:22px;flex-shrink:0}
.set{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--ln)}.set:last-child{border:0}
.sw{width:46px;height:26px;border-radius:14px;border:0;background:var(--ln);position:relative;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}.sw.on::after{left:23px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--sf);width:100%;max-width:440px;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}
@media(min-width:900px){.mask{align-items:center}.sheet{border-radius:24px}}
.sheet h3{font-size:20px;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,10px);background:#1a1a1a;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:900px){.toast{bottom:32px}}
/* ── vsc sidebar / activity bar (from main app: vscode-theme.css) ── */
:root{--vsc-bg:#f4f7fc;--vsc-sidebar:#eef1f8;--vsc-actbar:#e3e8f0;--vsc-panel:#ffffff;--vsc-border:#d1d9e6;--vsc-text:#1a2332;--vsc-input-bg:#f0f2f6;--vsc-muted:#6b7a8f;--vsc-accent:#7C3AED;--vsc-accent2:#A78BFA;--vsc-card-bg:#ffffff;--vsc-glass-bg:rgba(124,58,237,0.04);--vsc-glass-border:rgba(124,58,237,0.08);--vsc-font:'Plus Jakarta Sans','DM Sans',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--vsc-bg:#0f1419;--vsc-sidebar:#151b23;--vsc-actbar:#1c2333;--vsc-panel:#1c2433;--vsc-border:#2d3748;--vsc-text:#e2e8f0;--vsc-input-bg:#1a2233;--vsc-muted:#8892a4;--vsc-card-bg:#1c2433;--vsc-glass-bg:rgba(255,255,255,0.04);--vsc-glass-border:rgba(255,255,255,0.06)}}
:root[data-theme="dark"]{--vsc-bg:#0f1419;--vsc-sidebar:#151b23;--vsc-actbar:#1c2333;--vsc-panel:#1c2433;--vsc-border:#2d3748;--vsc-text:#e2e8f0;--vsc-input-bg:#1a2233;--vsc-muted:#8892a4;--vsc-card-bg:#1c2433;--vsc-glass-bg:rgba(255,255,255,0.04);--vsc-glass-border:rgba(255,255,255,0.06)}
:root[data-theme="light"]{--vsc-bg:#f4f7fc;--vsc-sidebar:#eef1f8;--vsc-actbar:#e3e8f0;--vsc-panel:#ffffff;--vsc-border:#d1d9e6;--vsc-text:#1a2332;--vsc-input-bg:#f0f2f6;--vsc-muted:#6b7a8f;--vsc-card-bg:#ffffff;--vsc-glass-bg:rgba(124,58,237,0.04);--vsc-glass-border:rgba(124,58,237,0.08)}
.vsc-body{display:flex;flex:1;min-height:0;position:relative}
.vsc-activity{width:52px;background:linear-gradient(180deg,var(--vsc-actbar),color-mix(in srgb,var(--vsc-accent) 4%,var(--vsc-actbar)));display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;border-right:1px solid var(--vsc-border);flex-shrink:0;position:relative;z-index:10}
.vsc-actbtn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:6px;color:var(--vsc-muted);transition:all .15s;position:relative;background:none;border:none;padding:0}
.vsc-actbtn:hover{color:var(--vsc-accent);background:color-mix(in srgb,var(--vsc-accent) 12%,transparent)}
.vsc-actbtn.active{color:var(--vsc-accent)}
.vsc-actbtn.active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--vsc-accent);border-radius:0 4px 4px 0}
.vsc-actbtn svg{width:22px;height:22px}
.vsc-actbtn-menu{margin-bottom:6px}
.vsc-actbtn-menu svg{width:22px;height:22px}
.vsc-act-spacer{flex:1}
.vsc-sidebar{width:160px;background:var(--vsc-sidebar);border-right:1px solid var(--vsc-border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;transition:width .2s;overflow-y:auto}
.vsc-sidebar.collapsed{width:0;min-width:0;padding:0;border-right:none;overflow:hidden}
.vsc-sidebar .brand{padding:0 12px 14px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;color:var(--vsc-text);flex-shrink:0}
.vsc-sidebar .brand .logo{width:30px;height:30px;font-size:11px;margin:0;flex-shrink:0}
.vsc-sidebar #snav{display:flex;flex-direction:column;width:100%;flex-shrink:0}
.vsc-cat-btn{padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:0;background:none;border:none;width:100%;text-align:left;color:var(--vsc-text);font-family:var(--vsc-font);font-size:13px;transition:background .15s,color .15s;flex-shrink:0;border-bottom:1px solid var(--vsc-glass-border)}
.vsc-cat-btn:hover{background:color-mix(in srgb,var(--vsc-accent) 10%,transparent);color:var(--vsc-accent)}
.vsc-cat-btn.active{background:color-mix(in srgb,var(--vsc-accent) 15%,transparent);color:var(--vsc-accent);font-weight:600;border-left:3px solid var(--vsc-accent)}
.vsc-cat-btn svg{width:16px;height:16px;flex-shrink:0;color:var(--vsc-muted);transition:color .15s}
.vsc-cat-btn:hover svg,.vsc-cat-btn.active svg{color:var(--vsc-accent)}
/* overview tab chips (MyMTN original chip look) */
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
#app .main .chip.on{background:var(--vsc-accent);border-color:var(--vsc-accent);color:#fff}
.tile{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 14px}
.tile small{font-size:12px;color:var(--mu)}
.tile b{display:block;font-size:24px;margin-top:2px}
.pv{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln);font-size:14px}
.pv:last-child{border:0}
.pv .em{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
.pv .grow{flex:1;min-width:60px}
.pv .bar{flex:1;margin:0}
.pv .v{text-align:right;line-height:1.15}
.pv .v b{font-size:15px}
.pv .v .mu{display:block;font-size:11px}
.al{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln);font-size:13px;align-items:flex-start}
.al:last-child{border:0}
.al .d{width:10px;height:10px;border-radius:50%;margin-top:4px;flex-shrink:0}
/* hero slideshow */
.hero{display:block}
.hslide{display:none;animation:hf .35s ease}

 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(p)){$('lerr').textContent='Enter a valid email address.';return}
 if(n.length<4){$('lerr').textContent='Enter your password.';return}
 $('lerr').textContent='';$('login').classList.add('hide');$('app').classList.remove('hide');var h=new Date().getHours();$('hi').textContent=h<12?'Good morning':h<17?'Good afternoon':'Good evening';render()};
$('pin').onkeydown=function(e){if(e.key==='Enter')$('go').click()};
$('th').onclick=theme;$('bell').onclick=function(){toast('No new notifications')};
</script>
